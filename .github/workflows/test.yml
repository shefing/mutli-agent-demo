name: Test Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_minimal.txt
        pip install llamafirewall

        # Fix NeMo GuardRails + OpenAI compatibility issue
        # Install everything, then force compatible versions
        pip install nemoguardrails presidio-analyzer presidio-anonymizer

        # Force compatible langchain and openai versions
        # All langchain packages must be from the same 0.2.x era to work together.
        # nemoguardrails pulls in langchain 1.x which is incompatible with the 0.2.x sub-packages.
        # We pin every langchain package to known-compatible versions.
        pip install --force-reinstall --no-deps "openai==1.54.0"
        pip install --force-reinstall --no-deps "langchain==0.2.16"
        pip install --force-reinstall --no-deps "langchain-core==0.2.43"
        pip install --force-reinstall --no-deps "langchain-community==0.2.16"
        pip install --force-reinstall --no-deps "langchain-openai==0.1.25"
        pip install tiktoken

        # Pin httpx to avoid breaking LlamaFirewall/OpenAI SDK
        pip install "httpx<0.28.0"

        # Verify versions and compatibility
        echo "Verifying package versions..."
        python -c "import openai; print(f'✓ OpenAI: {openai.__version__}')"
        python -c "import langchain; print(f'✓ langchain: {langchain.__version__}')"
        python -c "import langchain_core; print(f'✓ langchain-core: {langchain_core.__version__}')"
        python -c "import langchain_community; print(f'✓ langchain-community: {langchain_community.__version__}')"
        python -c "import langchain_openai; print('✓ langchain-openai: importable')"
        python -c "import httpx; print(f'✓ httpx: {httpx.__version__}')"
        python -c "import tiktoken; print(f'✓ tiktoken: {tiktoken.__version__}')"
        python -c "import openai; assert openai.__version__ < '1.58.0', 'OpenAI version too new!'"
        python -c "import nemoguardrails; print('✓ NeMo GuardRails importable')"
        python -c "import llamafirewall; print('✓ LlamaFirewall importable')"
        # Verify ChatOpenAI can actually be loaded (catches langchain version mismatches)
        python -c "from langchain_openai import ChatOpenAI; print('✓ ChatOpenAI loadable')"
        echo "✅ All package versions compatible"

    - name: Run DataDisclosureGuard false positive test
      id: test_disclosure_fix
      continue-on-error: true
      run: python test_data_disclosure_fix.py

    - name: Run DataDisclosureGuard alignment test
      id: test_alignment_fix
      continue-on-error: true
      run: python test_alignment_fix.py

    - name: Run user-provided notification contact test
      id: test_notification_contact
      continue-on-error: true
      run: python test_user_provided_notification_contact.py

    - name: Run deviation/bias detection test
      id: test_deviations
      continue-on-error: true
      run: python test_deviations.py

    - name: Run PromptGuard scanner test
      id: test_prompt_guard
      continue-on-error: true
      run: python test_prompt_guard_scanner.py

    - name: Run AlignmentCheck dual dimensions test
      id: test_alignment_dual_dimensions
      continue-on-error: true
      env:
        TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      run: python test_alignment_dual_dimensions.py

    - name: Run AlignmentCheck vs FactChecker separation test
      id: test_alignment_vs_factchecker
      continue-on-error: true
      env:
        TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      run: python test_alignment_vs_factchecker.py

    - name: Run AlignmentCheck scanner test
      id: test_alignment_check
      continue-on-error: true
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: python test_alignment_check.py

    - name: Run Native LlamaFirewall scanner test
      id: test_native_llamafirewall
      continue-on-error: true
      env:
        TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      run: python test_native_llamafirewall_scanner.py

    - name: Run FactsChecker scanner test
      id: test_facts_checker
      continue-on-error: true
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: python test_facts_checker_scanner.py

    - name: Collect test results
      id: results
      if: always()
      run: |
        FAILED=0
        PASSED=0
        TOTAL=10
        FAILED_TESTS=""

        # Check each test outcome
        if [ "${{ steps.test_disclosure_fix.outcome }}" != "success" ]; then
          FAILED=$((FAILED + 1)); FAILED_TESTS="${FAILED_TESTS}• test_data_disclosure_fix.py\n"
        else PASSED=$((PASSED + 1)); fi

        if [ "${{ steps.test_alignment_fix.outcome }}" != "success" ]; then
          FAILED=$((FAILED + 1)); FAILED_TESTS="${FAILED_TESTS}• test_alignment_fix.py\n"
        else PASSED=$((PASSED + 1)); fi

        if [ "${{ steps.test_notification_contact.outcome }}" != "success" ]; then
          FAILED=$((FAILED + 1)); FAILED_TESTS="${FAILED_TESTS}• test_user_provided_notification_contact.py\n"
        else PASSED=$((PASSED + 1)); fi

        if [ "${{ steps.test_deviations.outcome }}" != "success" ]; then
          FAILED=$((FAILED + 1)); FAILED_TESTS="${FAILED_TESTS}• test_deviations.py\n"
        else PASSED=$((PASSED + 1)); fi

        if [ "${{ steps.test_prompt_guard.outcome }}" != "success" ]; then
          FAILED=$((FAILED + 1)); FAILED_TESTS="${FAILED_TESTS}• test_prompt_guard_scanner.py\n"
        else PASSED=$((PASSED + 1)); fi

        if [ "${{ steps.test_alignment_dual_dimensions.outcome }}" != "success" ]; then
          FAILED=$((FAILED + 1)); FAILED_TESTS="${FAILED_TESTS}• test_alignment_dual_dimensions.py\n"
        else PASSED=$((PASSED + 1)); fi

        if [ "${{ steps.test_alignment_vs_factchecker.outcome }}" != "success" ]; then
          FAILED=$((FAILED + 1)); FAILED_TESTS="${FAILED_TESTS}• test_alignment_vs_factchecker.py\n"
        else PASSED=$((PASSED + 1)); fi

        if [ "${{ steps.test_alignment_check.outcome }}" != "success" ]; then
          FAILED=$((FAILED + 1)); FAILED_TESTS="${FAILED_TESTS}• test_alignment_check.py\n"
        else PASSED=$((PASSED + 1)); fi

        if [ "${{ steps.test_native_llamafirewall.outcome }}" != "success" ]; then
          FAILED=$((FAILED + 1)); FAILED_TESTS="${FAILED_TESTS}• test_native_llamafirewall_scanner.py\n"
        else PASSED=$((PASSED + 1)); fi

        if [ "${{ steps.test_facts_checker.outcome }}" != "success" ]; then
          FAILED=$((FAILED + 1)); FAILED_TESTS="${FAILED_TESTS}• test_facts_checker_scanner.py\n"
        else PASSED=$((PASSED + 1)); fi

        if [ -z "$FAILED_TESTS" ]; then
          FAILED_TESTS="None"
        fi

        echo "passed=$PASSED" >> $GITHUB_OUTPUT
        echo "failed=$FAILED" >> $GITHUB_OUTPUT
        echo "total=$TOTAL" >> $GITHUB_OUTPUT
        echo "failed_tests=$FAILED_TESTS" >> $GITHUB_OUTPUT

        echo "Results: $PASSED/$TOTAL passed"
        if [ $FAILED -gt 0 ]; then
          echo "❌ Failed tests:"
          echo -e "$FAILED_TESTS"
          exit 1
        fi

    - name: Notify Slack on failure
      if: failure()
      uses: slackapi/slack-github-action@v1.26.0
      with:
        payload: |
          {
            "text": "❌ Test Suite Failed on main branch",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "❌ AI Agent Guards - Test Failure",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Repository:*\n${{ github.repository }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Branch:*\n${{ github.ref_name }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Commit:*\n<${{ github.event.head_commit.url }}|${{ github.sha }}>"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Author:*\n${{ github.event.head_commit.author.name }}"
                  }
                ]
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Tests Passed:* ${{ steps.results.outputs.passed }}/${{ steps.results.outputs.total }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Tests Failed:* ${{ steps.results.outputs.failed }}/${{ steps.results.outputs.total }}"
                  }
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*All Tests:*\n• test_data_disclosure_fix.py: ${{ steps.test_disclosure_fix.outcome }}\n• test_alignment_fix.py: ${{ steps.test_alignment_fix.outcome }}\n• test_user_provided_notification_contact.py: ${{ steps.test_notification_contact.outcome }}\n• test_deviations.py: ${{ steps.test_deviations.outcome }}\n• test_prompt_guard_scanner.py: ${{ steps.test_prompt_guard.outcome }}\n• test_alignment_dual_dimensions.py: ${{ steps.test_alignment_dual_dimensions.outcome }}\n• test_alignment_vs_factchecker.py: ${{ steps.test_alignment_vs_factchecker.outcome }}\n• test_alignment_check.py: ${{ steps.test_alignment_check.outcome }}\n• test_native_llamafirewall_scanner.py: ${{ steps.test_native_llamafirewall.outcome }}\n• test_facts_checker_scanner.py: ${{ steps.test_facts_checker.outcome }}"
                }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "View Workflow Run",
                      "emoji": true
                    },
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  },
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "View Commit",
                      "emoji": true
                    },
                    "url": "${{ github.event.head_commit.url }}"
                  }
                ]
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

    - name: Notify Slack on success
      if: success()
      uses: slackapi/slack-github-action@v1.26.0
      with:
        payload: |
          {
            "text": "✅ Test Suite Passed on main branch",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "✅ AI Agent Guards - Tests Passed",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Repository:*\n${{ github.repository }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Branch:*\n${{ github.ref_name }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Tests Passed:*\n${{ steps.results.outputs.passed }}/${{ steps.results.outputs.total }} ✅"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Author:*\n${{ github.event.head_commit.author.name }}"
                  }
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Commit:* <${{ github.event.head_commit.url }}|${{ github.sha }}>"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
