name: Test Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_minimal.txt
        pip install llamafirewall
        pip install nemoguardrails
        pip install presidio-analyzer presidio-anonymizer

    - name: Run DataDisclosureGuard false positive test
      id: test_disclosure_fix
      continue-on-error: true
      run: |
        python test_data_disclosure_fix.py
        echo "status=$?" >> $GITHUB_OUTPUT

    - name: Run DataDisclosureGuard alignment test
      id: test_alignment_fix
      continue-on-error: true
      run: |
        python test_alignment_fix.py
        echo "status=$?" >> $GITHUB_OUTPUT

    - name: Run deviation/bias detection test
      id: test_deviations
      continue-on-error: true
      run: |
        python test_deviations.py
        echo "status=$?" >> $GITHUB_OUTPUT

    - name: Run AlignmentCheck scanner test (optional)
      id: test_alignment_check
      continue-on-error: true
      if: secrets.TOGETHER_API_KEY != ''
      env:
        TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      run: |
        echo "Running AlignmentCheck test with API key..."
        python test_alignment_check.py
        echo "status=$?" >> $GITHUB_OUTPUT

    - name: Skip AlignmentCheck test (no API key)
      if: secrets.TOGETHER_API_KEY == ''
      run: |
        echo "⏭️ Skipping AlignmentCheck test (TOGETHER_API_KEY not configured)"
        echo "   To enable: Add TOGETHER_API_KEY to GitHub repository secrets"

    - name: Collect test results
      id: results
      if: always()
      run: |
        FAILED=0
        PASSED=0
        SKIPPED=0
        TOTAL=3
        FAILED_TESTS=""

        # Core tests (always run)
        if [ "${{ steps.test_disclosure_fix.outcome }}" != "success" ]; then
          FAILED=$((FAILED + 1))
          FAILED_TESTS="${FAILED_TESTS}• test_data_disclosure_fix.py\n"
        else
          PASSED=$((PASSED + 1))
        fi

        if [ "${{ steps.test_alignment_fix.outcome }}" != "success" ]; then
          FAILED=$((FAILED + 1))
          FAILED_TESTS="${FAILED_TESTS}• test_alignment_fix.py\n"
        else
          PASSED=$((PASSED + 1))
        fi

        if [ "${{ steps.test_deviations.outcome }}" != "success" ]; then
          FAILED=$((FAILED + 1))
          FAILED_TESTS="${FAILED_TESTS}• test_deviations.py\n"
        else
          PASSED=$((PASSED + 1))
        fi

        # Optional test (AlignmentCheck - requires API key)
        # If the step didn't run (no outcome), it was skipped
        if [ -z "${{ steps.test_alignment_check.outcome }}" ]; then
          SKIPPED=$((SKIPPED + 1))
        elif [ "${{ steps.test_alignment_check.outcome }}" == "success" ]; then
          PASSED=$((PASSED + 1))
          TOTAL=$((TOTAL + 1))
        elif [ "${{ steps.test_alignment_check.outcome }}" == "failure" ]; then
          FAILED=$((FAILED + 1))
          TOTAL=$((TOTAL + 1))
          FAILED_TESTS="${FAILED_TESTS}• test_alignment_check.py\n"
        fi

        # If no tests failed, set a default message
        if [ -z "$FAILED_TESTS" ]; then
          FAILED_TESTS="None"
        fi

        echo "failed=$FAILED" >> $GITHUB_OUTPUT
        echo "passed=$PASSED" >> $GITHUB_OUTPUT
        echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT
        echo "total=$TOTAL" >> $GITHUB_OUTPUT
        echo "failed_tests=$FAILED_TESTS" >> $GITHUB_OUTPUT

        # Fail the job if any tests failed
        if [ $FAILED -gt 0 ]; then
          exit 1
        fi

    - name: Notify Slack on failure
      if: failure()
      uses: slackapi/slack-github-action@v1.26.0
      with:
        payload: |
          {
            "text": "❌ Test Suite Failed on main branch",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "❌ AI Agent Guards - Test Failure",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Repository:*\n${{ github.repository }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Branch:*\n${{ github.ref_name }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Commit:*\n<${{ github.event.head_commit.url }}|${{ github.sha }}>"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Author:*\n${{ github.event.head_commit.author.name }}"
                  }
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Commit Message:*\n${{ github.event.head_commit.message }}"
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Tests Passed:* ${{ steps.results.outputs.passed }}/${{ steps.results.outputs.total }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Tests Failed:* ${{ steps.results.outputs.failed }}/${{ steps.results.outputs.total }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Tests Skipped:* ${{ steps.results.outputs.skipped }}"
                  }
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Failed Tests:*\ntest_data_disclosure_fix.py: ${{ steps.test_disclosure_fix.outcome }}\ntest_alignment_fix.py: ${{ steps.test_alignment_fix.outcome }}\ntest_deviations.py: ${{ steps.test_deviations.outcome }}"
                }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "View Workflow Run",
                      "emoji": true
                    },
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  },
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "View Commit",
                      "emoji": true
                    },
                    "url": "${{ github.event.head_commit.url }}"
                  }
                ]
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

    - name: Notify Slack on success
      if: success()
      uses: slackapi/slack-github-action@v1.26.0
      with:
        payload: |
          {
            "text": "✅ Test Suite Passed on main branch",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "✅ AI Agent Guards - Tests Passed",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Repository:*\n${{ github.repository }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Branch:*\n${{ github.ref_name }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Tests Passed:*\n${{ steps.results.outputs.passed }}/${{ steps.results.outputs.total }} ✅"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Author:*\n${{ github.event.head_commit.author.name }}"
                  }
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Commit:* <${{ github.event.head_commit.url }}|${{ github.sha }}>\n${{ github.event.head_commit.message }}"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
